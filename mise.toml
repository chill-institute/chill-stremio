[tools]
node = "24.22.1"
pnpm = "12.14.0"
actionlint = "1.7.12"
zizmor = "1.31.1"

[tasks.setup]
description = "Install locked dependencies, pinned Web client, browser and fixture media"
run = ["pnpm install --frozen-lockfile", "pnpm exec vp run setup"]

[tasks.verify]
description = "Run credential-free type, protocol and workflow checks"
run = ["pnpm exec vp run verify", "actionlint", "zizmor .github/workflows"]

[tasks."fixture:smoke"]
description = "Run real Stremio Web playback twice from fresh state"
run = "pnpm exec vp run fixture:smoke"

[tasks."hls:smoke"]
description = "Prove HLS audio switching, seek and captions in Stremio Web; append `separate-fmp4` for the separate-track fixture"
run = "pnpm exec vp run hls:smoke"

[tasks."fixture:serve"]
description = "Serve local fixtures in the foreground"
run = "pnpm exec vp run fixture:serve"

[tasks.cleanup]
description = "Remove generated media after stopping foreground services; preserve evidence"
run = "pnpm exec vp run cleanup"

[tasks."native:android:setup"]
description = "Verify Android runner prerequisites and cache the pinned TV APK"
run = "pnpm exec vp run native:android:setup"

[tasks."native:android:probe"]
description = "Probe two isolated TV boots and client entrypoints; playback stays blocked"
run = "pnpm exec vp run native:android:probe"

[tasks."native:desktop:probe"]
description = "Probe two isolated headless Linux desktop runs; append `hosted` or `hosted-hls` for the hosted adapter"
run = "pnpm exec vp run native:desktop:probe"

[tasks."live:setup"]
description = "Encode the lawful fixture movie and prepare the live allowance cache"
run = "pnpm exec vp run live:setup"

[tasks."live:probe"]
description = "Upload the fixture to the designated put.io account, decode it, and clean up"
run = "pnpm exec vp run live:probe"

[tasks."live:search"]
description = "Measure put.io file search on generated release and folder names in the designated account, and clean up"
run = "pnpm exec vp run live:search"

[tasks."native:desktop:setup"]
description = "Install and verify the pinned Linux Flatpak client in its own installation"
run = "pnpm exec vp run native:desktop:setup"

[tasks."adapter:serve"]
description = "Run the loopback Engine-backed adapter with private environment configuration"
run = "pnpm exec vp run adapter:serve"

[tasks."adapter:smoke"]
description = "Prove Engine-backed adapter installation and decoded playback against local fakes"
run = "pnpm exec vp run adapter:smoke"

[tasks."adapter:live"]
description = "Sign in to designated accounts and prove Stremio playback through Engine"
run = "pnpm exec vp run adapter:live"

[tasks."hosted:serve"]
description = "Run the stateless multi-user adapter with private runtime configuration"
run = "pnpm exec vp run hosted:serve"

[tasks."hosted:smoke"]
description = "Record and verify the hosted discovery/acquisition/playback flow with local fakes"
run = "pnpm exec vp run hosted:smoke"

[tasks."hosted:container"]
description = "Prove a built read-only Linux image with a generated credential"
run = "pnpm exec vp run hosted:container"

[tasks."hosted:live"]
description = "Prove bounded real Engine acquisition with generated discovery and owned fixture media"
run = "pnpm exec vp run hosted:live"

[tasks."hosted:reuse"]
description = "Prove production Engine reuses one put.io transfer for repeated add-on requests"
run = "pnpm exec vp run hosted:reuse"

[tasks."hosted:owned"]
description = "Prove a video already in put.io plays through the deployed adapter"
run = "pnpm exec vp run hosted:owned"

[tasks."hosted:acquire"]
description = "Acquire the one approved release through the deployed adapter, play it (FFmpeg, or Stremio Web with LIVE_ACQUIRE_WEB=1), and clean up"
run = "pnpm exec vp run hosted:acquire"

[tasks."hosted:public"]
description = "Read the deployed adapter with the designated account's add-on credential"
# Node alone: the canary runs this next to the credential without installing packages.
run = "node harness/live/public.ts"

[tasks."hosted:credential"]
description = "Mint the designated account's add-on credential to a pipe or an owner-only file"
# Node alone: package-runner banners would corrupt the credential on stdout.
run = "node harness/live/credential.ts"

[tasks."native:android:account"]
description = "Pair the designated Stremio account and probe fixture playback in an isolated TV emulator"
run = "pnpm exec vp run native:android:account"
