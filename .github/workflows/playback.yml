name: Web playback

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playback:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install fixture encoder and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg fonts-dejavu-core
      - run: mise run setup
      - id: deps
        run: pnpm exec playwright install-deps chromium
      - run: mise run fixture:smoke
      # Each lane owns its listeners and artifact directory; run all after one failure.
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: mise run hls:smoke
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: mise run adapter:smoke
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: mise run hosted:smoke
      - name: Retain fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playback-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
      - name: Clean fixture runtime
        if: always()
        run: mise run cleanup
