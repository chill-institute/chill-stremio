name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: pnpm install --frozen-lockfile
      - run: mise run verify
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked semantic-release
        run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund

      - name: Smoke-test semantic-release
        run: node .github/release/smoke.mjs

      - name: Clean fixture runtime
        if: always()
        run: mise run cleanup

      - name: Scan pushed range
        if: ${{ !cancelled() }}
        uses: chill-institute/.github/.github/actions/scan@04bad7d160da50b0509abfd5ff2e382aaf7d1aef # v1.0.0

  release:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: publish
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked semantic-release
        run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund
      - name: Mint a chill-ci token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHILL_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHILL_CI_APP_PRIVATE_KEY }}
          owner: chill-institute
          repositories: chill-stremio
          permission-contents: write
      - name: Tag and release
        run: node .github/release/release.mjs
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
